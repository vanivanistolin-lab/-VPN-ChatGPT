name: Build standalone VPN release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get verified official VPN engine
        shell: powershell
        run: ./fetch-engine.ps1
      - name: Build and run local checks
        shell: powershell
        run: |
          ./build.ps1
          ./src/check_engine.ps1
          python ./src/build_msi.py
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
      - name: Publish preliminary standalone release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $api="https://api.github.com/repos/$env:GH_REPO/releases"
          $notes=@'
          Самостоятельный VPNKRUT-SUB 3.0.1 для Windows x64. В одном MSI: приложение, официальный sing-box 1.14.4, Wintun 0.14.1 и общий каталог бесплатных серверов.
          
          Happ, INCY и v2rayTun не требуются. При подключении Windows запрашивает права администратора. Работающий другой VPN автоматически не отключается.
          
          Кнопка Админ убрана. Alt+A: локальная админ-панель. Возвращено автоподключение Happ для ChatGPT; флажок включён по умолчанию. Публикация каталога из программы требует токен владельца GitHub; пользователям токен не нужен.
          
          Проверены сборка, локальные тесты и 9 конфигураций через sing-box check. Реальное TUN-подключение и внешний IP не проверены: текущий VPN автора не отключался. Релиз предварительный. Бинарные файлы CI не подписаны доверенным сертификатом.
          '@
          try{$release=Invoke-RestMethod -Uri "$api/tags/v3.0.1" -Headers $headers}
          catch{
            if([int]$_.Exception.Response.StatusCode -ne 404){throw}
            $body=@{tag_name='v3.0.1';target_commitish=$env:GH_SHA;name='VPNKRUT-SUB 3.0.1 — встроенный VPN';body=$notes;draft=$false;prerelease=$true}|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Uri $api -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          }
          $files=@('dist/VPNKRUT-SUB-3.0.1-Setup.msi','README.md','THIRD-PARTY.md','USER_AGREEMENT.md')
          foreach($file in $files){
            $name=[IO.Path]::GetFileName($file)
            if($release.assets.name -contains $name){continue}
            $upload="https://uploads.github.com/repos/$env:GH_REPO/releases/$($release.id)/assets?name=$([Uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post -Uri $upload -Headers $headers -ContentType 'application/octet-stream' -InFile $file|Out-Null
          }
          Write-Output $release.html_url

