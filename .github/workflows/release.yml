name: Publish release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v1.1.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'}
          $api = "https://api.github.com/repos/$env:GH_REPO/releases"
          $notes = @'
          Windows x64: установщик, расширение Chrome с мини-окном и локальный помощник состояния VPN.

          Скачайте ChatGPTRefresh-Setup.exe и запустите один раз. После установки откроется README с инструкцией подключения расширения в Chrome.

          VPN и Happ эта сборка не отключает. Сборка и синтаксис проверены; полная установка после перезагрузки пока не проверена. EXE не подписан.
          '@
          try { $release = Invoke-RestMethod -Uri "$api/tags/v1.1.1" -Headers $headers }
          catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $body = @{tag_name='v1.1.1';target_commitish=$env:GH_SHA;name='VPN ChatGPT v1.1.1';body=$notes;draft=$false;prerelease=$true} | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri $api -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          }
          Compress-Archive -Path 'extension/*' -DestinationPath 'ChatGPT-VPN-Refresh-v1.1.1.zip' -Force
          $files = @('dist/ChatGPTRefresh-Setup.exe','ChatGPT-VPN-Refresh-v1.1.1.zip','README.md')
          foreach ($file in $files) {
            $name = [IO.Path]::GetFileName($file)
            if ($release.assets.name -contains $name) { continue }
            $upload = "https://uploads.github.com/repos/$env:GH_REPO/releases/$($release.id)/assets?name=$([Uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post -Uri $upload -Headers $headers -ContentType 'application/octet-stream' -InFile $file | Out-Null
          }
          Write-Output $release.html_url
